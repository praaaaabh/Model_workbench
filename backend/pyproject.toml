[tool.poetry]
name = "model-workbench-backend"
version = "0.1.0"
description = "FastAPI backend for Model Workbench"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
ruff = "^0.4.8"
black = "^24.4.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 100
exclude = "/(\\.venv|\\.git|\\.mypy_cache|\\.ruff_cache)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
